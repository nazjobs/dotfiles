# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset


# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                         Keybinds                            ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


# https://wiki.hyprland.org/Configuring/Binds/
bindd = $mainMod, RETURN, Opens your preferred terminal emulator ($terminal), exec, $terminal
bindd = $mainMod CTRL, RETURN, Opens your preferred terminal emulator (ghostty), exec, ghostty
bindd = $mainMod, Q, Closes (not kill) current window, killactive,
bindd = $mainMod, V, Switches current window between floating and tiling mode, togglefloating,
bindd = $mainMod, F, Toggles current window fullscreen mode, fullscreen
# bindd = $mainMod, Y, Pin current window (shows on all workspaces), pin
bindd = $mainMod CTRL, N, Toggles current window split mode, layoutmsg, togglesplit # dwindle
# bind = $mainMod, F1, exec, ~/.config/custom_scripts/waybarThemeSwitcher.sh

# bindd = , Print, Creates a screenshot of an area, exec, $shot-region,
# bindd = CTRL, Print, Creates a screenshot of the active window, exec, $shot-window,
# bindd = ALT, Print, Creates a screenshot of the active display, exec, $shot-screen,

# Screenshot (select area, save, and copy to clipboard)
# bindd = , Print, Takes a screenshot of an area, exec, $screenshot
# Screenshot with Flameshot's interactive GUI
bind = , Print, exec, flameshot gui

# Ayugram Shortcut cuz im lazy
bindd = $mainMod, Y, AyuGram, exec, flatpak run com.ayugram.desktop

# Zen Shortcut cuz im lazy
bindd = $mainMod, Z, Zen Browser, exec, zen-browser

# Volume Control Shortcut cuz im lazy
bindd = $mainMod CTRL, A, Volume Control, exec, pavucontrol

# Color Picker using Hyprland's built in colorpicker(hyprpicker) and auto-copying the picked color hex to clipboard
bindd = CTRL ALT, C, Color Picker, exec, hyprpicker -a

# Emoji Picker 
# bind = SUPER SHIFT, PERIOD, exec, ~/.local/bin/kaomoji-picker
bind = SUPER SHIFT, PERIOD, exec, emote

# ======= Window Actions =======

## Move window with mainMod + LMB/RMB and dragging
bindd = $mainMod, mouse:272, Move the window towards a direction, movewindow
## Move window towards a direction
bindd = $mainMod SHIFT, H, Move active window to the left, movewindow, l
bindd = $mainMod SHIFT, L, Move active window to the right, movewindow, r
bindd = $mainMod SHIFT, K, Move active window upwards, movewindow, u
bindd = $mainMod SHIFT, J, Move active window downwards, movewindow, d
## Move focus with mainMod + arrow keys
bindd = $mainMod, L, Move focus to the left, movefocus, l
bindd = $mainMod, H,  Move focus to the right, movefocus, r
bindd = $mainMod, K, Move focus upwards, movefocus, u
bindd = $mainMod, J, Move focus downwards, movefocus, d
# bindd = $mainMod, left, Move focus to the left, movefocus, l
# bindd = $mainMod, right,  Move focus to the right, movefocus, r
# bindd = $mainMod, up, Move focus upwards, movefocus, u
# bindd = $mainMod, down, Move focus downwards, movefocus, d

# Switch Keyboard Layout (English/Amharic)
# bind = SUPER SHIFT, space, dispatch, switchxkblayout,at-translated-set-2-keyboard , next
# bind = SUPER SHIFT, space, dispatch, switchxkblayout, at-translated-set-2-keyboard, next
# bind = SUPER SHIFT, space, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next


# ======= Workspace Actions =======

# Scroll through existing workspaces with mainMod + PAGEUP or PAGEDOWN
bindd = $mainMod, PAGE_DOWN, Scroll through workspaces incrementally, workspace, e+1
bindd = $mainMod, PAGE_UP, Scroll through workspaces decrementally, workspace, e-1
bindd = $mainMod, slash, Switch to the previous workspace, workspace, previous
# bindd = ALT, TAB, Switch to the previous workspace, workspace, previous
# Special workspaces (scratchpads)
bindd = $mainMod, minus, Move active window to Special workspace, movetoworkspace, special
bindd = $mainMod, equal, Toggles the Special workspace, togglespecialworkspace, special
bindd = $mainMod, F1, Call special workspace scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod ALT SHIFT, F1, Move active window to special workspace scratchpad, movetoworkspacesilent, special:scratchpad

# ======= Wallpaper Binds ========

# ======= Additional Settings =======

# https://wiki.hyprland.org/Configuring/Binds
binds {
    allow_workspace_cycles = 1
    workspace_back_and_forth = 1
    workspace_center_on = 1
	movefocus_cycles_fullscreen = true
	window_direction_monitor_fallback = true
}

