# Commands and Apps to be executed at launch

exec-once = poweralertd
exec-once = fcitx5 -d

exec-once = $UserScripts/WallpaperAutoChange.sh $HOME/Pictures/wallpapers

# GNOME Keyring daemon for secrets storage (Cursor, VS Code, etc.)
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
